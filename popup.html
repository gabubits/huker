<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Huker</title>
    <link rel="stylesheet" href="popup.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.min.css"
    />
  </head>
  <body>
    <div class="header">
      <h1>Huker</h1>
    </div>
    <div class="container">
      <!-- Chat Atual -->
      <section class="card">
        <div class="card-header">
          <span class="icon"><i class="ri-message-3-line"></i></span>
          <h2>Chat atual</h2>
        </div>
        <div id="chatInfo" class="info-box">Nenhum chat detectado.</div>
      </section>
      <!-- Associar Janela -->
      <section class="card">
        <div class="card-header">
          <span class="icon"><i class="ri-link"></i></span>
          <h2>Associar janela</h2>
        </div>
        <label for="clienteCodigo" class="form-label">Código do cliente</label>
        <input
          type="text"
          id="clienteCodigo"
          placeholder="Ex: 12345"
          class="form-input"
        />
        <div id="janelaInfo" class="hint-text">
          Janela atual será associada a este código de cliente.
        </div>
        <button id="associar" class="btn btn-primary">
          <i class="ri-link-m"></i> Associar janela
        </button>
        <button id="desassociarAtual" class="btn btn-secondary">
          <i class="ri-link-unlink-m"></i> Remover associação
        </button>
        <button id="sincronizarChats" class="btn btn-warning">
          <i class="ri-refresh-line"></i> Sincronizar chats
        </button>
      </section>
      <!-- Status -->
      <div id="status" class="status"></div>
      <!-- Lista -->
      <section class="card">
        <div class="list-header">
          <div class="card-header" style="margin-bottom: 0">
            <span class="icon"><i class="ri-list-check"></i></span>
            <h2>Chats associados</h2>
          </div>
          <span id="contador" class="badge">0</span>
        </div>
        <div id="lista">
          <p class="empty-state">Nenhum chat associado.</p>
        </div>
      </section>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
